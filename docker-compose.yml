version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: voxiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: voxiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxiq_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://voxiq:${POSTGRES_PASSWORD}@db:5432/voxiq
      - DEBUG=false
      - PROJECT_NAME=VOXIQ
      - AUDIO_RETENTION_MINUTES=60
      - STORE_RAW_AUDIO=true
      - LLM_PROVIDER=none
    ports:
      - "8000:8000"
    volumes:
      - voxiq_audio_data:/app/data/audio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxiq_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  voxiq_audio_data:
